packages:
    - "app/*"
    - "packages/*"

allowBuilds:
    "audiobus-protocol@https://codeload.github.com/designerzen/audiobus-protocol/tar.gz/83637433b919b7a0652787b1561a5e51fbe15801": true
    "@parcel/watcher": false
    core-js: false
    electron: false
    electron-winstaller: false
    esbuild: false
    leveldown: false
    onnxruntime-node: false
    protobufjs: false
    sharp: false
    workerd: false

patchedDependencies:
    app-builder-lib@26.8.1: patches/app-builder-lib@26.8.1.patch
# Packages that audiobus installs from GitHub; use the submodule checkouts here instead.
overrides:
    control-surface: "workspace:*"
    netronome: "workspace:*"
    pitfalls: "workspace:*"
    sion: "workspace:*"
    midi-devices: "workspace:*"
