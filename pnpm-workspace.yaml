packages:
    - "app/*"
    - "packages/*"
    - "../audiobus-protocol"

allowBuilds:
    "@parcel/watcher": false
    core-js: false
    electron: false
    electron-winstaller: false
    esbuild: false
    leveldown: false
    onnxruntime-node: false
    protobufjs: false
    sharp: false
    workerd: false

patchedDependencies:
    app-builder-lib@26.8.1: patches/app-builder-lib@26.8.1.patch
# Packages that audiobus installs from GitHub; use the submodule checkouts here instead.
overrides:
    audiobus-protocol: "workspace:*"
    control-surface: "workspace:*"
    netronome: "workspace:*"
    pitfalls: "workspace:*"
    sion: "workspace:*"
