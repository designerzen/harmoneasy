name: Build and Publish Electron App

on:
    push:
        branches: ["main"]
        paths:
            - "app/harmoneasy/**"
            - "packages/**"
            - "scripts/**"
            - "patches/**"
            - "package.json"
            - "pnpm-lock.yaml"
            - "pnpm-workspace.yaml"
            - ".gitattributes"
            - ".github/workflows/electron-build.yml"
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    build:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                # @electron/rebuild 4.0.3 uses node-gyp 11, which cannot detect VS 2026.
                os: [windows-2022, ubuntu-24.04, macos-latest]
                node-version: [24]

        steps:
            - uses: actions/checkout@v7.0.1

            - name: Check out committed submodule revisions
              run: git submodule update --init --recursive

            - uses: pnpm/action-setup@v6.1.0
              name: Install pnpm
              with:
                  run_install: false

            - name: Install Node.js
              uses: actions/setup-node@v7.0.0
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "pnpm"

            - name: Install system dependencies (Linux)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential
                  sudo apt-get install -y libasound2-dev
                  sudo apt-get install -y pkg-config
                  sudo apt-get install -y python3
                  echo "=== System dependencies installed ==="
                  ls -la /usr/include/alsa/ || echo "ALSA headers not found!"
                  pkg-config --list-all | grep alsa || echo "ALSA not found in pkg-config"
                  pkg-config --cflags alsa || echo "pkg-config alsa failed"

            - name: Install dependencies (no build)
              run: |
                  pnpm config set fetch-timeout 60000
                  pnpm install --frozen-lockfile --prefer-offline --ignore-scripts
              timeout-minutes: 40
              env:
                  npm_config_build_from_source: "false"
                  npm_config_ignore_scripts: "true"

            - name: Build Netronome library and workers
              run: pnpm --filter netronome run build:lib

            - name: Build native module
              run: cd app/harmoneasy && pnpm run build-native
              env:
                  CFLAGS: "-I/usr/include"
                  CXXFLAGS: "-I/usr/include"
                  LDFLAGS: "-L/usr/lib"
                  LD_LIBRARY_PATH: "/usr/lib"

            - name: Build Electron app
              run: pnpm run build:electron
              timeout-minutes: 45
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CSC_LINK: ${{ secrets.CSC_LINK }}
                  CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
                  WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
                  WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

            - name: List build artifacts
              run: |
                  echo "Looking for build artifacts..."
                  ls -la app/harmoneasy/dist-electron/ 2>/dev/null || echo "app/harmoneasy/dist-electron/ not found"
                  find app/harmoneasy/dist-electron -maxdepth 1 -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.deb" \) 2>/dev/null || echo "No artifacts found"
              shell: bash

            - name: Upload Windows artifacts
              if: runner.os == 'Windows'
              uses: actions/upload-artifact@v7.0.1
              with:
                  name: windows-build
                  path: |
                      app/harmoneasy/dist-electron/*.exe
                      app/harmoneasy/dist-electron/*.msi
                      app/harmoneasy/dist-electron/latest*.yml
                      app/harmoneasy/dist-electron/*.blockmap
                  if-no-files-found: ignore

            - name: Upload macOS artifacts
              if: runner.os == 'macOS'
              uses: actions/upload-artifact@v7.0.1
              with:
                  name: macos-build
                  path: |
                      app/harmoneasy/dist-electron/*.dmg
                      app/harmoneasy/dist-electron/*.zip
                      app/harmoneasy/dist-electron/latest*.yml
                      app/harmoneasy/dist-electron/*.blockmap
                  if-no-files-found: ignore

            - name: Upload Linux artifacts
              if: runner.os == 'Linux'
              uses: actions/upload-artifact@v7.0.1
              with:
                  name: linux-build
                  path: |
                      app/harmoneasy/dist-electron/*.AppImage
                      app/harmoneasy/dist-electron/*.deb
                      app/harmoneasy/dist-electron/latest*.yml
                      app/harmoneasy/dist-electron/*.blockmap
                  if-no-files-found: ignore

    publish:
        needs: build
        runs-on: ubuntu-24.04
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v7.0.1

            - name: Check release version
              id: version
              uses: actions/github-script@v8
              with:
                  script: |
                      const fs = require('node:fs');
                      const { version } = JSON.parse(fs.readFileSync('app/harmoneasy/package.json', 'utf8'));
                      const tag = `v${version}`;
                      core.setOutput('tag', tag);
                      try {
                        await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
                        core.setOutput('publish', 'false');
                        core.info(`${tag} is already published. Bump the app version to release an update.`);
                      } catch (error) {
                        if (error.status !== 404) throw error;
                        core.setOutput('publish', 'true');
                      }

            - name: Download all artifacts
              if: steps.version.outputs.publish == 'true'
              uses: actions/download-artifact@v8.0.1
              with:
                  path: artifacts

            - name: Prepare release directory
              if: steps.version.outputs.publish == 'true'
              run: |
                  mkdir -p releases
                  if [ -d artifacts ]; then
                    find artifacts -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.deb" -o -name "latest*.yml" -o -name "*.blockmap" \) -exec cp {} releases/ \;
                  fi
                  echo "Release files:"
                  ls -lah releases/
                  for manifest in latest.yml latest-mac.yml latest-linux.yml; do
                    if [ ! -s "releases/$manifest" ]; then
                      echo "Missing update metadata: $manifest" >&2
                      exit 1
                    fi
                  done
                  if [ -z "$(ls -A releases)" ]; then
                    echo "No release artifacts found; aborting release." >&2
                    exit 1
                  fi
              shell: bash

            - name: Create Release
              if: steps.version.outputs.publish == 'true'
              uses: softprops/action-gh-release@v3.0.3
              with:
                  files: releases/*
                  tag_name: ${{ steps.version.outputs.tag }}
                  target_commitish: ${{ github.sha }}
                  fail_on_unmatched_files: true
                  draft: false
                  prerelease: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}